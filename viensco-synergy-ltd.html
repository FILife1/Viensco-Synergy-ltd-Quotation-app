<style>
:root{--or:#F5A300;--ord:#C98200;--ban:#E97E1C;--ink:#161616;--ink2:#444;--mute:#7a7a7a;--bg:#F6F4EF;--card:#fff;--line:#E4DFD3;--ok:#1d8a4b;--bad:#c0392b;--r:12px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
body{padding-bottom:80px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-height:42px}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 4px;font-weight:600}
a{color:var(--ord);font-weight:600}
#splash{position:fixed;inset:0;background:#fff;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{width:min(55vw,240px);border-radius:50%}#splash.gone{opacity:0;pointer-events:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:7px 14px;background:#fff;border-bottom:3px solid var(--or)}
.top img{height:36px;width:auto}.top b{display:block;font-size:15px;line-height:1.1}.top small{color:var(--mute);font-size:12px}
.warnbar{background:#fff1d6;color:#6b4b00;padding:8px 14px;font-size:13px}
main{max-width:780px;margin:0 auto;padding:12px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16.5px}.card h3{margin:14px 0 6px;font-size:14px}
.card.warn,.warn{background:#fff6e0;border-color:#f0d58f;color:#6b4b00;font-size:13.5px}
details.card summary{font-weight:700;font-size:16px;cursor:pointer;padding:2px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f{margin-bottom:10px}.hint{font-size:12px;color:var(--mute);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:#fff;font-weight:600;cursor:pointer;min-height:42px}
.btn.pri{background:var(--or);border-color:var(--or);color:#1a1200}.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13.5px}.btn.ghost{border-color:var(--line)}.btn.danger{color:var(--bad);border-color:#efc4bf}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:600;cursor:pointer;font-size:13.5px}.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}.chip.on{background:var(--or);border-color:var(--or)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:17px}
.card .kpis .kpi{background:var(--bg);border:0}
.hero{display:flex;gap:12px;align-items:center}.hero img{height:56px}.hero h2{margin:0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.qa .btn:first-child{grid-column:1/-1}
.rates{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0ece2}
.item .nm{flex:1;font-size:14px;min-width:0}.item .nm small{display:block;color:var(--mute);font-size:12px}
.item>input{width:112px;text-align:right;padding:6px 8px;min-height:36px;flex:none}
.item.dr,.item.pick,[data-ec].item,[data-ev].item{cursor:pointer}
.rt{text-align:right;font-size:13.5px}.rt b{display:block}
.tag{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2);font-weight:600}
.st{display:inline-block;font-size:11px;border-radius:99px;padding:1px 8px;background:#eee;margin-top:2px}
.st-Paid,.st-accepted,.st-confirmed,.st-received,.st-delivered{background:#e1f3e8;color:var(--ok)}.st-Unpaid,.st-lost,.st-cancelled{background:#fdeceb;color:var(--bad)}.st-Partpaid,.st-sent,.st-issued{background:#fff1d6;color:#8a5a00}
.imp{color:var(--ord);font-weight:600}
.banner{background:#fff6e0;border:1px solid #f0d58f;border-radius:10px;padding:8px 10px;font-size:13.5px}.banner .btn{margin-left:6px}
.cc{border-bottom:1px solid var(--line);padding-bottom:6px}.rep{font-size:12.5px;color:var(--ink2);padding:2px 0 2px 10px}.rep span{color:var(--mute)}
.repbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fcfbf8}
.edtop{display:flex;align-items:center;gap:10px}.edtop .tt{flex:1;text-align:center}.edtop .tt b{display:block}.edtop .tt small{color:var(--mute)}
#ed-top{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.trow.gt{font-size:16px;border-bottom:2px solid var(--or)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer;font-weight:400;color:var(--ink);margin:0}
.chk input{width:22px;height:22px;min-height:22px;flex:none;margin:1px 0 0;accent-color:var(--ord);padding:0}.chk.sm{font-size:12.5px;color:var(--ink2)}
#lines .ln,#imp-lines .ln{padding:10px 0;border-bottom:1px solid #f0ece2}
#lines .nm,#imp-lines .nm{margin-bottom:6px;min-height:42px}
.r2{display:grid;grid-template-columns:62px 58px 1fr 54px 1fr 38px;gap:6px;align-items:end}
.r2.dn{grid-template-columns:70px 1fr 38px}.r2.imp{grid-template-columns:70px 1fr 38px}
.r2 label{font-size:11px;margin:0 0 2px;color:var(--mute)}.r2 input{padding:7px 6px;min-height:38px}
.r2 .am{text-align:right;font-size:12.5px;white-space:nowrap}.r2 .am b{display:block;padding:8px 0}
@media(max-width:540px){.r2{grid-template-columns:60px 54px 1fr 50px 38px}.r2 .am{grid-column:1/-2;text-align:left}.r2 .am label{display:inline;margin-right:6px}.r2 .am b{display:inline}.grid3{grid-template-columns:1fr 1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-size:12px;color:var(--mute);padding:4px;border-bottom:1px solid var(--line)}.tbl td{padding:6px 4px;border-bottom:1px solid #f0ece2}.tbl .n{text-align:right}
.bd{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}.bd td{padding:4px 0;border-bottom:1px dashed var(--line)}.bd .r{text-align:right}.bd tr.b td{font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs button{flex:1;border:0;background:transparent;padding:7px 2px 6px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}nav.tabs button span{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--or)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}#toast.show{opacity:1}
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}.mbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.msheet{position:relative;background:#fff;width:100%;max-width:640px;max-height:90vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.mh button{border:0;background:none;font-size:20px;cursor:pointer}
#mb{padding:14px 16px 24px;overflow-y:auto}
#sheetWrap{width:100%;overflow:hidden;margin-top:6px}
#sheet{width:210mm;background:#fff;color:#111;font-size:12px;transform-origin:top left;box-shadow:0 1px 6px rgba(0,0,0,.2)}

#sheet.lh-on{background-repeat:repeat-y;background-size:210mm 297mm;background-position:0 0}

#sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#sheet .hl{display:flex;gap:10px;align-items:flex-start}#sheet .emb{height:62px;width:auto}
#sheet .hm{display:flex;flex-direction:column;align-items:flex-start}#sheet .wm{height:50px;width:auto}

#sheet .phn{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
#sheet .dsc{font-weight:800;font-size:12px;line-height:1.35;margin:4px 0 2px;max-width:112mm}#sheet .eml{font-weight:700;font-size:12px;margin-bottom:6px}
#sheet .ban{background:var(--ban);color:#fff;font-weight:800;text-align:center;font-size:19px;padding:5px;letter-spacing:.5px;margin:4px 0 8px}

#sheet .meta{flex:1;border-collapse:collapse;font-size:12px}#sheet .meta td{padding:2px 4px;border-bottom:1px solid #999}#sheet .meta .k{font-weight:700;white-space:nowrap;width:1%}

#sheet .tot tr.gt td{background:var(--ban);color:#fff;font-weight:800;font-size:13.5px}#sheet .tot tr.small td{font-size:11px;color:#444}#sheet .tot tr.bold td{font-weight:800}
#sheet .words{margin-top:8px;font-size:12px;border-bottom:1px solid #111;padding-bottom:3px}
#sheet .rcv{font-weight:700;font-size:11.5px;margin-top:6px}
#sheet .terms{margin-top:8px;font-size:11px;line-height:1.5}#sheet .terms h4{margin:6px 0 1px;font-size:11.5px}
#sheet .sign{display:flex;justify-content:space-between;gap:30px;margin-top:14px;align-items:flex-end}#sheet .sign>div{flex:1;text-align:center;font-size:11.5px}
#sheet .sign img{height:52px;display:block;margin:0 auto -4px}#sheet .sp{height:46px}#sheet .ln{border-top:1px solid #111;padding-top:3px}
#sheet .thx{text-align:center;font-style:italic;font-weight:700;margin-top:10px;font-size:11.5px}
#sheet .ftr{display:flex;justify-content:space-between;gap:6px;border-top:2px solid var(--ban);margin-top:12px;padding-top:5px;font-size:10.5px;font-weight:700}
#sheet .rc-amt{border:2px solid #111;background:#FCE3C4;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin-bottom:6px}#sheet .rc-amt .lbl{font-weight:800}#sheet .rc-amt .val{font-size:20px;font-weight:800}
#sheet .dn-box{display:flex;gap:30px;margin-top:8px;border:1.5px solid #111;padding:6px 8px}#sheet .gd{color:var(--ban);font-weight:800;text-align:center;margin:10px 0 4px}
#sheet .chk{display:flex;gap:14px;border:1.5px solid #111;padding:8px;line-height:2;font-weight:600;cursor:default;font-size:12px}#sheet .chk>div{flex:1}
#sheet .lhw{width:100%;border-collapse:collapse}#sheet .sp1{height:54mm}#sheet .sp2{height:26mm}#sheet .lhc{padding:0 18mm 0 14mm;vertical-align:top}
@media print{
  html,body{background:#fff;padding:0}
  .noprint,.top,nav.tabs,#toast,#splash,#modal,.warnbar{display:none!important}
  main{padding:0;max-width:none}.view{display:none!important}#v-edit{display:block!important}
  #sheetWrap{height:auto!important;overflow:visible;margin:0}
  #sheet{transform:none!important;box-shadow:none;width:auto}
  #sheet:not(.lh-on){padding:0}#sheet.lh-on{width:210mm}
  #sheet tr{break-inside:avoid}#sheet .sign,#sheet .tot,#sheet .terms{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.bar{display:flex;gap:10px;align-items:center;margin:10px 12px 0;padding:10px 12px;background:var(--ink);color:#fff;border-radius:var(--r)}
.bar p{margin:0;flex:1;font-size:13.5px}.bar .btn{white-space:nowrap}
#sheet.xp{box-shadow:none}
.btn:disabled{opacity:.55;cursor:wait}

  let sub = 0, ex = 0, qty = 0;

      var c = document.createElement('canvas'); c.width = Math.round(pw * f); c.height = Math.round(ph * f * n);
      var g = c.getContext('2d'); P.pages.forEach(function (p, i) { g.drawImage(p, 0, i * ph * f, pw * f, ph * f); });

  }

  /* ---- PDF ---- */
  function b64(url) { var s = atob(url.split(',')[1]), u = new Uint8Array(s.length), i; for (i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function buildPDF(list, pw, ph) {
    var enc = new TextEncoder(), parts = [], offs = [], len = 0, N = list.length, i;

    var kids = []; for (i = 0; i < N; i++) kids.push((3 + 3 * i) + ' 0 R');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>');
    list.forEach(function (j, k) {
      var p = 3 + 3 * k, c = p + 1, im = p + 2, cs = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
      obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + c + ' 0 R >>');
      obj(c, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
      offs[im] = len;
      push(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + j.w + ' /Height ' + j.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.data.length + ' >>\nstream\n');
      push(j.data); push('\nendstream\nendobj\n');

    for (i = 1; i < total; i++) x += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
    push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');

    return pages(el, opts).then(function (P) {
      var list = P.pages.map(function (c) { return { data: b64(c.toDataURL('image/jpeg', 0.92)), w: c.width, h: c.height }; });
      return buildPDF(list, 595.28, 841.89);
    });
  }

  /* ---- delivery ---- */
  function save(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function share(blob, name, title) {
    var f = new File([blob], name, { type: blob.type });

    save(blob, name); return Promise.resolve(false);
  }

<script>
'use strict';
/* ===== navigation & modal ===== */

$('#mx').onclick = closeModal; $('.mbg').onclick = closeModal;
const opt = (v, t, sel) => `<option value="${esc(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${esc(t)}</option>`;

/* ===== documents: helpers ===== */
const curDoc = () => S.docs.find(d => d.id === S.cur);
let saveT;

}

/* ===== HOME ===== */
function renderHome() {
  const invs = S.docs.filter(d => d.type === 'invoice');
  const out = invs.reduce((s, d) => s + Math.max(0, totals(d).balance) * num(d.rate), 0);

function createDoc(type) {

function openDoc(id) { S.cur = id; show('edit'); }
function isEmpty(d) { return d.type === 'receipt' ? !num(d.amount) : (!d.lines.length && !d.custId && !d.vendId); }

function editorHTML(d) {
  const s = S.settings, T = d.type, c = custOf(d);

  if (T === 'quote' || T === 'proforma') h += fI(d, 'validDays', 'Valid for (days)', 'number');
  h += '</div>';

  /* B. party */
  if (T === 'po') {
    const v = vendOf(d);
    h += `<div class="card"><h2>Vendor</h2><div class="f"><label>Supplier</label><select data-f="vendId">${opt('', '— select vendor —', d.vendId)}${S.vendors.slice().sort((a, b) => a.company.localeCompare(b.company)).map(x => opt(x.id, `${x.company} (${x.country})`, d.vendId)).join('')}</select></div>

      <div class="f"><label>Representative</label><select data-f="repId">${opt('', reps.length ? '— select representative —' : '(no representatives saved)', d.repId)}${reps.map(r => opt(r.id, `${r.name}${r.title ? ' – ' + r.title : ''}`, d.repId)).join('')}</select></div>

  return `<h2>Totals</h2>${r('Sub-total', mon(t.sub, cur))}${t.dsc ? r('Discount', '-' + mon(t.dsc, cur)) : ''}${t.frt ? r(frtLabel(d), mon(t.frt, cur)) : ''}
    ${d.type !== 'po' ? (vo.exempt ? r('VAT', 'Exempt') : r(esc(vo.name) + (vo.mode === 'incl' ? ' (incl.)' : ''), mon(t.vat, cur))) : ''}${r('TOTAL', mon(t.total, cur), 'gt')}
    ${num(d.wht) ? r('Less WHT ' + d.wht + '%', '-' + mon(t.wht, cur)) + r('Net payable', mon(t.payable, cur)) : ''}${d.type === 'invoice' ? r('Paid', mon(t.paid, cur)) + r('Balance', mon(Math.max(0, t.balance), cur), 'gt') + `<div class="hint">Status: ${invStatus(d)}</div>` : ''}

}

/* ===== export: PDF / image of any document (quotation, proforma, invoice, receipt, PO, waybill / delivery note) ===== */
function exportEl(d) {
  const lh = S.settings.printStyle === 'letterhead', el = document.createElement('div'); el.id = 'sheet';
  if (lh) { el.innerHTML = sheetBody(d); el.style.padding = '0 18mm 14px 14mm'; } else el.innerHTML = sheetHTML(d);
  return el;
}
const exportOpts = () => S.settings.printStyle === 'letterhead' ? { bg: IMG.letterhead, top: 204, bottom: 98 } : {};
function exportName(d, ext) {
  const p = partyName(d).replace(/[^\w]+/g, '_').replace(/^_|_$/g, '');
  return TYPES[d.type].n.replace(/\s+/g, '-') + '-' + d.no.replace(/\//g, '-') + (p ? '-' + p : '') + '.' + ext;
}
async function exportDoc(kind) {
  const d = curDoc(); if (!d) return;
  const btns = $$('#ed-pdf,#ed-img,#ed-share'); btns.forEach(b => b.disabled = true);
  toast('Preparing ' + (kind === 'png' ? 'image' : 'PDF') + '…');
  try {
    const el = exportEl(d), o = exportOpts();
    if (kind === 'png') { const n = exportName(d, 'png'); VExport.save(await VExport.png(el, o), n); toast('Saved ' + n); }
    else {
      const n = exportName(d, 'pdf'), blob = await VExport.pdf(el, o);
      if (kind === 'share') { const ok = await VExport.share(blob, n, n); if (!ok) toast('Sharing not available here – PDF downloaded instead'); }
      else { VExport.save(blob, n); toast('Saved ' + n); }
    }
  } catch (e) { toast('Export is not supported in this browser – use Print, then Save as PDF'); }
  finally { btns.forEach(b => b.disabled = false); }
}
function convertDoc(d, type, dup) {
  const n = newDoc(type);
  Object.assign(n, { custId: d.custId, repId: d.repId, dept: d.dept, rfqNo: d.rfqNo, rfqDate: d.rfqDate, lpoNo: d.lpoNo, lpoDate: d.lpoDate, lines: clone(d.lines), notes: d.notes, from: d.id });
  if (dup || type !== 'po') Object.assign(n, { cur: d.cur, rate: d.rate, vat: d.vat, wht: d.wht, disc: d.disc, frt: clone(d.frt) });
  if (dup) Object.assign(n, { terms: d.terms, vendId: d.vendId, payType: d.payType, creditDays: d.creditDays, validDays: d.validDays, incoterm: d.incoterm, delivery: d.delivery, shipTo: d.shipTo });
  if (type === 'po' && !dup) {
    n.cur = 'USD'; n.rate = S.settings.fx.USD;
    n.lines = n.lines.map(l => { const it = l.itemId && getItem(l.itemId); return Object.assign({}, l, { price: it && isImport(it) && num(it.fob) ? Math.round(num(it.fob) * (S.settings.fx[it.cur || 'USD'] || 1) / n.rate * 100) / 100 : 0, disc: 0 }); });
  }
  if (type === 'dn' && d.type === 'invoice') n.ref = d.no;
  S.docs.push(n); persist.docs(); S.cur = n.id; renderEditor(); window.scrollTo(0, 0); return n;
}
function recordPayment(d) {
  const amt = num($('#pay-amt').value); if (amt <= 0) { toast('Enter the amount received'); return; }
  const r = newDoc('receipt');
  Object.assign(r, { custId: d.custId, repId: d.repId, cur: d.cur, rate: d.rate, invId: d.id, amount: amt, method: $('#pay-method').value, ref: $('#pay-ref').value, date: $('#pay-date').value || today() });
  d.payments.push({ id: uid(), date: r.date, amt, method: r.method, ref: r.ref, rcpt: r.id });
  S.docs.push(r); persist.docs(); toast('Receipt ' + r.no + ' created'); openDoc(r.id);
}

/* import costing */
function impState() {
  if (!S.imp) S.imp = { cur: 'USD', rate: S.settings.fx.USD, freight: '', insPct: S.settings.insPct, clearPct: S.settings.clearPct, margin: S.settings.margin, lines: [{ d: '', qty: 1, fob: '', duty: 'sw' }] };
  return S.imp;
}
function impCalc(m) {
  const rate = num(m.rate) || 1, L = m.lines.map(l => ({ l, fobN: num(l.qty) * num(l.fob) * rate }));
  const totalFob = L.reduce((s, x) => s + x.fobN, 0), frtN = num(m.freight) * rate, ins = totalFob * num(m.insPct) / 100;
  const out = L.map(x => { const sh = totalFob ? x.fobN / totalFob : 0, b = landedFrom(x.fobN, frtN * sh, ins * sh, dutyRate(x.l.duty), num(m.clearPct)); const q = num(x.l.qty) || 1; const unit = b.total / q; return Object.assign(b, { q, unit, sell: r50(unit * (1 + num(m.margin) / 100)) }); });
  const sum = k => out.reduce((s, b) => s + b[k], 0);
  return { out, totalFob, frtN, ins, cif: sum('cif'), duty: sum('duty'), levies: sum('sur') + sum('etls') + sum('ciss'), clear: sum('clear'), total: sum('total'), importVat: sum('importVat'), rate };
}

function drawVats() {
  const s = S.settings;
  $('#vat-list').innerHTML = s.vats.map((v, i) => `<div class="repbox"><div class="f"><label>Name</label><input data-vi="${i}.name" value="${esc(v.name)}"></div><div class="grid3"><div class="f"><label>Rate %</label><input type="number" step="any" data-vi="${i}.rate" value="${esc(v.rate)}"></div>
    <div class="f"><label>Mode</label><select data-vi="${i}.mode">${opt('excl', 'Added to price', v.mode)}${opt('incl', 'Included in price', v.mode)}</select></div><div class="f"><label>&nbsp;</label><button class="btn sm ghost danger" data-vr="${i}">Remove</button></div></div>
    <label class="chk sm"><input type="checkbox" data-vi="${i}.exempt" ${v.exempt ? 'checked' : ''}><span>Exempt (print “VAT – Exempt”)</span></label></div>`).join('');
  $('#vat-list').oninput = $('#vat-list').onchange = e => { const k = e.target.dataset.vi; if (!k) return; const [i, f] = k.split('.'); s.vats[i][f] = f === 'rate' ? num(e.target.value) : e.target.type === 'checkbox' ? e.target.checked : e.target.value; persist.settings(); };
}
function exportData() {
  const data = { app: 'viensco-docs', v: 1, at: Date.now(), settings: S.settings, customers: S.customers, vendors: S.vendors, docs: S.docs, ovr: S.ovr, custom: S.custom, counters: S.counters };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = 'viensco-synergy-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); save('lastBackup', Date.now()); toast('Backup downloaded');
}
function importData(f) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (d.app !== 'viensco-docs') throw 0;
      if (!confirm('Replace everything on this device with the backup?')) return;
      ['settings', 'customers', 'vendors', 'docs', 'ovr', 'custom', 'counters'].forEach(k => save(k, d[k]));
      location.reload();
    } catch (e) { toast('That file is not a Viensco backup'); }
  };
  r.readAsText(f);
}

/* ===== boot ===== */
document.addEventListener('click', e => { if (e.target.closest('#ed-style')) return; });
$('#ed-style').value = S.settings.printStyle; $('#ed-sign').value = S.settings.sign;
/* ===== install (phone or PC) ===== */
let deferred = null;
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), isAndroid = /android/i.test(navigator.userAgent);
function showInstallBar() {
  if (standalone() || location.protocol === 'file:') return;
  if (Date.now() - load('installDismissed', 0) < 3 * 864e5) return;
  if (isIOS) { $('#installMsg').textContent = 'Install on iPhone: tap Share, then "Add to Home Screen".'; $('#installBtn').hidden = true; }
  else if (!deferred) return;
  $('#installBar').hidden = false;
}
function installHelp() {
  const m = $('#m-install'), b = $('#m-installBtn'); if (!m) return;
  if (standalone()) { m.textContent = 'Viensco Synergy Ltd is installed on this device and works offline.'; b.hidden = true; }
  else if (location.protocol === 'file:') { m.textContent = 'This copy was opened from a file, so it cannot be installed. Open the app from its https:// web link (your GitHub Pages address), then install it.'; b.hidden = true; }
  else if (isIOS) { m.textContent = 'On iPhone/iPad: open this page in Safari, tap the Share icon, then "Add to Home Screen".'; b.hidden = true; }
  else if (deferred) { m.textContent = 'Install the app for one-tap access, its own window and full offline use.'; b.hidden = false; }
  else { b.hidden = true; m.textContent = isAndroid ? 'Open the browser menu (⋮) and choose "Install app" or "Add to Home screen".' : 'On a PC: in Chrome or Edge click the install icon (⊕) at the right end of the address bar, or open the menu and choose "Install Viensco Synergy Ltd". Mac Safari: File → Add to Dock.'; }
  diag();
}
async function diag() {
  const box = $('#m-diag'); if (!box) return;
  const ok = (v, t, tip) => `<div>${v ? '✔' : '✘'} ${t}${!v && tip ? ` <span style="color:#c0392b">– ${tip}</span>` : ''}</div>`;
  const secure = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  let man = false, sw = false, cached = false;
  try { const l = document.querySelector('link[rel=manifest]'); man = !!l && (await fetch(l.href)).ok; } catch (e) { }
  try { const r = await navigator.serviceWorker.getRegistration(); sw = !!(r && (r.active || r.waiting || r.installing)); } catch (e) { }
  try { cached = (await caches.keys()).length > 0; } catch (e) { }
  box.innerHTML = '<b>Install check</b>' + ok(secure, 'Opened from a secure (https) link', 'use your https:// GitHub Pages link') + ok(man, 'App manifest found', 'upload manifest.webmanifest') +
    ok(sw, 'Offline service worker running', 'upload sw.js, then reload the page') + ok(cached, 'Files saved for offline use', 'open once while online and wait a few seconds') + ok(standalone(), 'Running as an installed app', '');
}
async function doInstall() { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) { } deferred = null; $('#installBar').hidden = true; installHelp(); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; showInstallBar(); installHelp(); });
window.addEventListener('appinstalled', () => { $('#installBar').hidden = true; deferred = null; toast('Viensco Synergy Ltd installed ✔'); installHelp(); });
$('#installBtn').onclick = doInstall; $('#installX').onclick = () => { $('#installBar').hidden = true; save('installDismissed', Date.now()); };
setTimeout(showInstallBar, 1500);
if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(() => setTimeout(diag, 1500)).catch(() => { });
if (!storageOK) { const w = $('#warn'); w.hidden = false; w.textContent = '⚠ This browser is not saving data for this file. Use Settings → Backup before closing, or open the app from a web link.'; }
show('home');
setTimeout(() => $('#splash').classList.add('gone'), 900);

</script>
</body>
</html>
